version: "1"
services:
  # ─── Backend API Service (FastAPI) ───────────────────────────────────────────
  - type: web
    name: url-shortener-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerContext: .
    dockerfilePath: Dockerfile
    autoDeployTrigger: commit
    rootDir: backend
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cold-caller-redis
          property: connectionString
      # 🚀 FIX 1: Formats the frontend's full public URL safely into a valid JSON array for Python/Pydantic
      - key: ALLOWED_ORIGINS
        value: '["${URL_SHORTENER_FRONTEND_URL}"]'

  # ─── Frontend Web App (Next.js) ──────────────────────────────────────────────
  - type: web
    name: url-shortener-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: Dockerfile
    autoDeployTrigger: commit
    rootDir: frontend
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      # 🚀 FIX 2: Bypasses the property restriction by reading Render's automatic global environment variables
      - key: NEXT_PUBLIC_API_URL
        value: "${URL_SHORTENER_BACKEND_URL}"

databases:
  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
  - name: url-shortener-db
    databaseName: urlshortener
    user: urlshortener_user
    plan: free
    region: oregon
    ipAllowList: []
