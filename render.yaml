version: "1"
services:
  # ─── Backend API Service (FastAPI) ───────────────────────────────────────────
  - type: web
    name: url-shortener-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerContext: .
    dockerfilePath: Dockerfile
    autoDeployTrigger: commit
    rootDir: backend
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cold-caller-redis
          property: connectionString
      # 🔥 FIX: Formats the raw string host into a valid stringified JSON list structure
      - key: ALLOWED_ORIGINS
        value: '["https://${URL_SHORTENER_FRONTEND_HOST}"]'

  # ─── Frontend Web App (Next.js) ──────────────────────────────────────────────
  - type: web
    name: url-shortener-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: Dockerfile
    autoDeployTrigger: commit
    rootDir: frontend
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: url-shortener-backend
          property: host

databases:
  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
  - name: url-shortener-db
    databaseName: urlshortener
    user: urlshortener_user
    plan: free
    region: oregon
    ipAllowList: []
