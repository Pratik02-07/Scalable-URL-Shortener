# Render Production Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: url-shortener-db
    databaseName: urlshortener
    user: urlshortener_user
    plan: free

services:
  # ─── Redis Cache ─────────────────────────────────────────────────────────────
  - type: redis
    name: url-shortener-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal access only from services in this Render account

  # ─── Backend API Service (FastAPI) ───────────────────────────────────────────
  - type: web
    name: url-shortener-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: url-shortener-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: url-shortener-frontend
          property: host

  # ─── Frontend Web App (Next.js) ──────────────────────────────────────────────
  - type: web
    name: url-shortener-frontend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    rootDir: frontend
    plan: free
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: url-shortener-backend
          property: host
