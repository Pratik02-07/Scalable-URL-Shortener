version: "1"
services:
  # ─── Redis Cache ─────────────────────────────────────────────────────────────
  - type: keyvalue
    name: url-shortener-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal access only

  # ─── Backend API Service (FastAPI) ───────────────────────────────────────────
  - type: web
    name: url-shortener-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerContext: .
    dockerfilePath: Dockerfile
    autoDeployTrigger: commit
    rootDir: backend
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: url-shortener-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: '["https://onrender.com", "https://url-shortener-frontend-qv6g.onrender.com"]'

  # ─── Frontend Web App (Next.js) ──────────────────────────────────────────────
  - type: web
    name: url-shortener-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: Dockerfile
    autoDeployTrigger: commit
    rootDir: frontend
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "https://url-shortener-backend-b729.onrender.com"
      - key: BACKEND_URL
        fromService:
          type: web
          name: url-shortener-backend
          property: host

databases:
  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
  - name: url-shortener-db
    databaseName: urlshortener
    user: urlshortener_user
    plan: free
    region: oregon
    ipAllowList: []
